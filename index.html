<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Place It Organize Stuff</title>
<style>
:root{--bg:#FBF3E7;--card:#FFFDF8;--ink:#3B2A33;--soft:#6B5560;--line:#EADCCB;--accent:#B8436E;--warn-bg:#FFF1C9;--warn-ink:#6A4B00}
@media (prefers-color-scheme:dark){:root{--bg:#1F1A1D;--card:#2A2327;--ink:#F3E9E2;--soft:#C5B4BB;--line:#43383E;--accent:#FF9DBF;--warn-bg:#4A3B10;--warn-ink:#FFE7A3}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:28px;line-height:1.25;margin:0 0 4px;text-wrap:balance}
h2{font-size:19px;margin:30px 0 6px;padding-top:14px;border-top:1px solid var(--line)}
p,li{color:var(--ink)}ul{padding-left:22px}li{margin:4px 0}
a{color:var(--accent)}
.meta{color:var(--soft);font-size:14px;margin:0 0 14px}
.nav{font-size:14px;margin:0 0 18px}.nav a{margin-right:14px;display:inline-block}
.draft{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 18px}
.fill{background:var(--warn-bg);color:var(--warn-ink);border-radius:4px;padding:0 4px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}
.tw{overflow-x:auto}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--card)}
</style>
</head>
<body>
<main>
<p class="nav"></p>
<h1>Legal</h1>
<p class="meta">Place It Organize Stuff</p>
<ul><li><a href="privacy.html">Privacy Policy</a> (English)</li><li><a href="terms.html">Terms of Use</a> (English)</li><li><a href="privacy-vi.html">Chính sách riêng tư</a> (Tiếng Việt)</li><li><a href="terms-vi.html">Điều khoản sử dụng</a> (Tiếng Việt)</li></ul>
</main>
</body>
</html>
